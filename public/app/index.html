<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automation</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .result-box {
            margin-top: 14px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 74px;
        }

        .hint {
            margin-top: 6px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="main-wrapper">
        <div id="toastHost" class="toast-host" aria-live="polite" aria-relevant="additions"></div>

        <header class="top-nav">
            <div class="nav-left">
                <a class="nav-brand" href="/">Softdebut Tools</a>
                <nav class="nav-links" aria-label="Primary">
                    <a class="nav-link" href="/">OpenProject</a>
                    <a class="nav-link is-active" href="/app">WFH</a>
                </nav>
            </div>

            <div class="nav-right"></div>
        </header>

        <div class="content-row">
            <div class="panel" style="max-width: none;">
                <header>
                    <h2>WFH Automation</h2>
                    <p>Run server-side Playwright steps for Debutservice</p>
                </header>

                <main>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="thaiName">ชื่อภาษาไทย</label>
                            <input id="thaiName" type="text" placeholder="เช่น สมชาย ใจดี" />
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="engName">ชื่อภาษาอังกฤษ</label>
                            <input id="engName" type="text" placeholder="e.g. John Doe" />
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="email">อีเมล</label>
                            <input id="email" type="text" placeholder="example@example.com" />
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="loginPassword">Password</label>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <input id="loginPassword" type="password" placeholder="Debutservice password" style="flex: 1;" disabled />
                                <button id="toggleLoginPassword" type="button" class="btn-secondary" style="width:auto; padding:10px 12px; display:none;">Show</button>
                            </div>
                            <button id="changeLoginPassword" type="button" class="btn-secondary" style="margin-top: 10px; width:auto; padding:10px 12px;">Change Password</button>
                            <div class="hint">Password is saved per user, but never shown again after saving.</div>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="phone">เบอร์โทรศัพท์</label>
                            <input id="phone" type="text" placeholder="0812345678" />
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="department">แผนก/สังกัด</label>
                            <select id="department" required>
                                <option value="">-- เลือกแผนก/สังกัด --</option>
                                <option value="Accounting">Accounting</option>
                                <option value="Administration">Administration</option>
                                <option value="Business Support">Business Support</option>
                                <option value="CEO">CEO</option>
                                <option value="Channel Management">Channel Management</option>
                                <option value="Content Editor">Content Editor</option>
                                <option value="Customer Support">Customer Support</option>
                                <option value="Developer Assistant Team 1">Developer Assistant Team 1</option>
                                <option value="Developer Assistant Team 3">Developer Assistant Team 3</option>
                                <option value="Development division">Development division</option>
                                <option value="Development Team A">Development Team A</option>
                                <option value="Development Team B">Development Team B</option>
                                <option value="Digital Marketing">Digital Marketing</option>
                                <option value="Finance &amp; Accounting">Finance &amp; Accounting</option>
                                <option value="Finance &amp; Accounting division">Finance &amp; Accounting division</option>
                                <option value="Financial Officer">Financial Officer</option>
                                <option value="Frontend Developer">Frontend Developer</option>
                                <option value="General Administration">General Administration</option>
                                <option value="Global Business">Global Business</option>
                                <option value="Gzy Cloud Service">Gzy Cloud Service</option>
                                <option value="Human Resource">Human Resource</option>
                                <option value="Infrastructure">Infrastructure</option>
                                <option value="International Business Development">International Business Development</option>
                                <option value="Officer">Officer</option>
                                <option value="Operation division">Operation division</option>
                                <option value="PM">PM</option>
                                <option value="Product division">Product division</option>
                                <option value="Product Management">Product Management</option>
                                <option value="Product Specialist">Product Specialist</option>
                                <option value="Product Specialist Team A">Product Specialist Team A</option>
                                <option value="Product Specialist Team B">Product Specialist Team B</option>
                                <option value="Project Management">Project Management</option>
                                <option value="Purchasing">Purchasing</option>
                                <option value="QA">QA</option>
                                <option value="Sale">Sale</option>
                                <option value="Sale Administration">Sale Administration</option>
                                <option value="Sale Team A">Sale Team A</option>
                                <option value="Sale Team B">Sale Team B</option>
                                <option value="Sale Team C">Sale Team C</option>
                                <option value="Secretary">Secretary</option>
                                <option value="System Analyst">System Analyst</option>
                                <option value="Team Administration 1">Team Administration 1</option>
                                <option value="Team Administration 2">Team Administration 2</option>
                                <option value="Team Backend BKK1">Team Backend BKK1</option>
                                <option value="Team Backend BKK2">Team Backend BKK2</option>
                                <option value="Team Backend BKK3">Team Backend BKK3</option>
                                <option value="Team Backend BKK4">Team Backend BKK4</option>
                                <option value="Team Backend CM1">Team Backend CM1</option>
                                <option value="Team Backend CM2">Team Backend CM2</option>
                                <option value="Team Backend CM3">Team Backend CM3</option>
                                <option value="Team Backend OS1">Team Backend OS1</option>
                                <option value="Team Business Support 1">Team Business Support 1</option>
                                <option value="Team Business Support 2">Team Business Support 2</option>
                                <option value="Team Frontend BKK1">Team Frontend BKK1</option>
                                <option value="Team Frontend OS1">Team Frontend OS1</option>
                                <option value="Team Mobile BKK1">Team Mobile BKK1</option>
                                <option value="Team SaaS">Team SaaS</option>
                                <option value="Team Tester BKK1">Team Tester BKK1</option>
                                <option value="Team Tester BKK2">Team Tester BKK2</option>
                                <option value="Technology division">Technology division</option>
                                <option value="UX and UI Designer">UX and UI Designer</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="because">เนื่องจาก</label>
                            <input id="because" type="text" placeholder="เช่น ขอใช้สิทธิ์" />
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="reason">เหตุผล</label>
                            <input id="reason" type="text" placeholder="เช่น ขอใช้สิทธิ์" />
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="extra">ข้อมูลเพิ่มเติม</label>
                            <input id="extra" type="text" placeholder="เช่น ขอใช้สิทธิ์" />
                        </div>

                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="startDate">วันที่เริ่ม</label>
                            <input id="startDate" type="date" />
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <label for="endDate">วันที่สิ้นสุด</label>
                            <input id="endDate" type="date" />
                        </div>
                    </div>

                    <div class="btn-row" style="margin-top: 14px;">
                        <button id="wfhSubmitBtn" type="button">Submit</button>
                        <button id="wfhSaveBtn" type="button" class="btn-secondary">Save Information</button>
                    </div>

                    <div id="screenshotWrap" style="display:none; margin-top: 14px;">
                        <label style="margin-bottom: 8px;">Screenshot</label>
                        <img id="screenshotImg" alt="Dry run screenshot" style="width: 100%; border-radius: 14px; border: 1px solid var(--border-color);" />
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script src="/app/app.js" defer></script>
</body>

</html>
